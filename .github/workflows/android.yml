name: Android

on:
  push:
    branches: ["owntv-base", "feature/full-product-takeover"]
  pull_request:
    branches: ["owntv-base", "feature/full-product-takeover"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK
        run: gradle :app:assembleStandardDebug --stacktrace
