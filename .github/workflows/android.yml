name: Android

on:
  push:
    branches: ["owntv-base", "feature/full-product-takeover"]
  pull_request:
    branches: ["owntv-base", "feature/full-product-takeover"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platforms used by the pinned stack
        run: sdkmanager "platforms;android-36" "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.4.1"

      - name: Build product UI library
        run: gradle :product-ui:assembleDebug --stacktrace

      - name: Build standard TV APK
        run: gradle :app:assembleStandardDebug --stacktrace

      - name: Build x86_64 emulator APK
        run: gradle :app:assembleX86_64Debug --stacktrace

      - name: Run app unit tests
        run: gradle :app:testStandardDebugUnitTest --stacktrace

      - name: Run product UI unit tests
        run: gradle :product-ui:testDebugUnitTest --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: iptv-player-debug-apks
          path: upstream/OwnTV/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
