name: Android

on:
  workflow_dispatch:
  push:
    branches: ["main", "owntv-base", "feature/full-product-takeover"]
  pull_request:
    branches: ["main", "owntv-base", "feature/full-product-takeover"]

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GPR_TOKEN: ${{ github.token }}
      GPR_USER: ${{ github.actor }}
    steps:
      - name: Checkout product repository
        uses: actions/checkout@v5

      - name: Checkout pinned public OwnTV source
        run: |
          git clone --depth 1 https://github.com/ahXN00/OwnTV.git upstream/OwnTV
          git -C upstream/OwnTV fetch --depth 1 origin f17cffb7bc7118675e09c64e02a427d84902f6b3
          git -C upstream/OwnTV checkout --detach f17cffb7bc7118675e09c64e02a427d84902f6b3

      - name: Validate GitHub Packages credentials
        run: |
          test -n "$GPR_TOKEN"
          test -n "$GPR_USER"
          echo "GitHub Packages credentials available via GITHUB_TOKEN."

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platforms used by the pinned stack
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.0"

      - name: Build product UI library
        run: gradle :product-ui:assembleDebug --stacktrace

      - name: Build standard TV APK
        run: gradle :app:assembleStandardDebug --stacktrace

      - name: Build x86_64 emulator APK
        run: gradle :app:assembleX86_64Debug --stacktrace

      - name: Run app unit tests
        run: gradle :app:testStandardDebugUnitTest --stacktrace

      - name: Run product UI unit tests
        run: gradle :product-ui:testDebugUnitTest --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-build-artifacts
          path: |
            upstream/OwnTV/app/build/outputs/**/*.apk
            product-ui/build/outputs/**/*.aar
