name: Android

on:
  workflow_dispatch:
  push:
    branches: ["main", "owntv-base", "feature/full-product-takeover"]
  pull_request:
    branches: ["main", "owntv-base", "feature/full-product-takeover"]

permissions:
  contents: read
  packages: read

env:
  ANDROID_COMPILE_SDK: "37"
  ANDROID_BUILD_TOOLS: "37.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GPR_TOKEN: ${{ github.token }}
      GPR_USER: ${{ github.actor }}
    steps:
      - name: Checkout product repository
        uses: actions/checkout@v5

      - name: Checkout pinned public OwnTV source
        run: |
          git clone --depth 1 https://github.com/ahXN00/OwnTV.git upstream/OwnTV
          git -C upstream/OwnTV fetch --depth 1 origin f17cffb7bc7118675e09c64e02a427d84902f6b3
          git -C upstream/OwnTV checkout --detach f17cffb7bc7118675e09c64e02a427d84902f6b3

      - name: Apply product launcher overlay to pinned OwnTV manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("upstream/OwnTV/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace('android:label="@string/app_name"', 'android:label="IPTV Player"', 1)
          old = '''        <activity
            android:name=".MainActivity"
            android:banner="@drawable/tv_banner"
            android:exported="true"
            android:launchMode="singleTop"
            android:windowSoftInputMode="adjustPan"
            android:theme="@style/Theme.OwnTV.Starting">
            <!-- LEANBACK_LAUNCHER shows it on TV launchers; LAUNCHER shows it on phone/tablet/box home
                 screens (so non-TV devices get an app icon, not just an install). -->
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
            <intent-filter>
                <action android:name="android.intent.action.VIEW" />
                <category android:name="android.intent.category.DEFAULT" />
                <category android:name="android.intent.category.BROWSABLE" />
                <data
                    android:host="play"
                    android:scheme="owntv" />
                <data
                    android:host="open"
                    android:scheme="owntv" />
            </intent-filter>
        </activity>'''
          new = '''        <activity
            android:name=".MainActivity"
            android:banner="@drawable/tv_banner"
            android:exported="false"
            android:launchMode="singleTop"
            android:windowSoftInputMode="adjustPan"
            android:theme="@style/Theme.OwnTV.Starting" />

        <activity
            android:name="com.bilalmc.iptvplayer.ui.IptvShellActivity"
            android:exported="true"
            android:launchMode="singleTop"
            android:windowSoftInputMode="adjustPan"
            android:theme="@style/Theme.IPTVPlayer.Starting">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
            <intent-filter>
                <action android:name="android.intent.action.VIEW" />
                <category android:name="android.intent.category.DEFAULT" />
                <category android:name="android.intent.category.BROWSABLE" />
                <data android:host="play" android:scheme="owntv" />
                <data android:host="open" android:scheme="owntv" />
            </intent-filter>
        </activity>'''
          if old not in s:
              raise SystemExit("Expected pinned OwnTV launcher activity was not found")
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Adapt pinned OwnTV app to API 37 toolchain
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("upstream/OwnTV/app/build.gradle.kts")
          s = p.read_text()
          old = '''    compileSdk {\n        version = release(36) {\n            minorApiLevel = 1\n        }\n    }'''
          if old not in s:
              raise SystemExit("Expected OwnTV compileSdk block was not found")
          p.write_text(s.replace(old, "    compileSdk = 37", 1))
          PY

      - name: Validate GitHub Packages credentials
        run: |
          test -n "$GPR_TOKEN"
          test -n "$GPR_USER"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 17 SDK preview platform
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --update || true
          sdkmanager --list > /tmp/sdkmanager-list.txt
          channel=""
          for candidate in 0 1 2 3; do
            if sdkmanager --channel="$candidate" --list 2>/dev/null | grep -Fq "platforms;android-37.0"; then
              channel="$candidate"
              break
            fi
          done
          if [[ -z "$channel" ]]; then
            echo "Android 17 platform package platforms;android-37.0 is not visible in any SDK channel."
            grep -F "android-37" /tmp/sdkmanager-list.txt || true
            exit 1
          fi
          echo "Installing Android 17 platform from sdkmanager channel $channel"
          sdkmanager --channel="$channel" "platforms;android-37.0" "build-tools;${ANDROID_BUILD_TOOLS}"
          test -f "$ANDROID_SDK_ROOT/platforms/android-37.0/android.jar"
          test -d "$ANDROID_SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}"
          ln -sfn "$ANDROID_SDK_ROOT/platforms/android-37.0" "$ANDROID_SDK_ROOT/platforms/android-${ANDROID_COMPILE_SDK}"

      - name: Verify Android SDK installation
        run: |
          test -f "$ANDROID_SDK_ROOT/platforms/android-${ANDROID_COMPILE_SDK}/android.jar"
          test -d "$ANDROID_SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.4.1"

      - name: Build product UI library
        run: gradle :product-ui:assembleDebug --stacktrace

      - name: Build standard TV APK
        run: gradle :app:assembleStandardDebug --stacktrace

      - name: Build x86_64 emulator APK
        run: gradle :app:assembleX86_64Debug --stacktrace

      - name: Run app unit tests
        run: gradle :app:testStandardDebugUnitTest --stacktrace

      - name: Run product UI unit tests
        run: gradle :product-ui:testDebugUnitTest --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-build-artifacts
          path: |
            upstream/OwnTV/app/build/outputs/**/*.apk
            product-ui/build/outputs/**/*.aar
