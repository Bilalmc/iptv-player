org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=false
kotlin.code.style=official

# Allow command-line Gradle builds to fetch SDK components that are not present on the runner.
android.builder.sdkDownload=true

# AGP 9 R8 optimization is enabled by the pinned OwnTV app; enable the required gradual-R8 support flag
# at the root build level so the embedded :app project can be configured from the product build.
android.r8.gradual.support=true

# IPTV Player product identity.
product.applicationId=com.bilalmc.iptvplayer
product.versionName=0.1.0

# Optional: local OwnTV_Core checkout. Keep credentials and machine-specific paths out of Git.
# owntv.corePath=/path/to/OwnTV_Core
# gpr.user=YOUR_GITHUB_USERNAME
# gpr.token=YOUR_GITHUB_PACKAGES_TOKEN
